<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosine 1.4</title>
<link rel="stylesheet" href="c1.css">
<link rel="icon" type="image/png" href="favicon.png">
<!-- Google Sign-In -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Configuration -->
<script src="config.js"></script>
</head>

<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
<div class="navContainer">
<div class="navLinks">
<a href="index.html" class="navLink">← Home</a>
<a href="/" class="navLink">Debate</a>
<a href="/history" class="navLink" id="historyLink">History</a>
</div>
<div class="userProfile">
<div class="userProfileInfo">
<div class="userName" id="userDisplayName">User</div>
<div class="userPlan" id="userDisplayPlan">Plan</div>
</div>
<button id="logoutBtnNav" class="logoutBtn">Logout</button>
</div>
</div>
</nav>

<!-- LOGIN PAGE (HIDDEN FOR THIS PAGE) -->
<div id="loginPage" class="loginPage hidden"></div>

<!-- MAIN APP -->
<div class="main hidden">

<nav class="navbar">
<div class="navContainer">
<div class="navLinks">
<a href="#" class="navLink" onclick="showDebatePage(event)">Debate</a>
<a href="#" class="navLink" onclick="showHistoryPage(event)">History</a>
</div>
<div class="userInfo">
<span id="userName">User</span>
<button id="logoutBtn" class="logoutBtn">Logout</button>
</div>
</div>
</nav>

<!-- DEBATE PAGE -->
<div id="debatePage" class="debatePage">
<div class="header">
<img src="v1-01.png" class="logo">

<div class="titleBlock">
<h1>Cosine <span class="gradient-text">1.4</span></h1>
<p class="subtitle">Make decisions more powerful.</p>
</div>
</div>

<div id="chatContainer" class="chatContainer hidden"></div>

<div class="inputRow">
<textarea id="promptBox" placeholder="Type your prompt" spellcheck="false"></textarea>
<button id="sendBtn" class="sendBtn" type="button">
<svg viewBox="0 0 24 24">
<path d="M2 21L23 12L2 3V10L17 12L2 14V21Z"></path>
</svg>
</button>
</div>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="historyPage">
<div class="historyContainer">
<h2>Your Debate History</h2>
<div id="historyList" class="historyList"></div>
</div>
</div>

<!-- DEBATE DETAIL VIEW -->
<div id="debateDetailPage" class="debateDetailPage">
<div class="debateDetailContainer">
<button class="backBtn" onclick="showHistoryPage(event)">← Back to History</button>
<div id="debateDetail" class="debateDetail"></div>
</div>
</div>

</div>

<div class="credit">
<img src="feaven.png">
<span>Feaven</span>
</div>

<script src="c1.js"></script>

</body>
</html>
