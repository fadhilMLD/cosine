<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://static.cloudflareinsights.com; connect-src 'self' https://paralyzingly-unspoken-dwayne.ngrok-free.dev https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
<title>Cosine 1.4</title>
<link rel="stylesheet" href="c1.css">
<link rel="icon" type="image/png" href="favicon.png">
<!-- Google Sign-In -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Configuration -->
<script src="config.js"></script>
</head>

<body>

<div id="accessDenied" class="accessDenied hidden">
<div class="accessDeniedCard">
<h2>Access denied</h2>
<p id="accessDeniedMessage">You do not have permission to view this project.</p>
<div class="accessDeniedActions">
<a class="accessDeniedBtn" href="signin.html">Sign in</a>
<a class="accessDeniedBtn secondary" href="projects.html">Back to projects</a>
</div>
</div>
</div>

<!-- NAVIGATION BAR -->
<nav class="navbar hidden">
<div class="navContainer">
<div class="navLinks">
</div>
</div>
</nav>

<!-- LOGIN PAGE -->
<div id="loginPage" class="loginPage hidden">

<div class="loginContainer">
<div class="header">
<img src="v1-01.png" class="logo">
<div class="titleBlock">
<h1>Cosine <span class="gradient-text">1.4</span></h1>
<p class="subtitle">Make decisions more powerful.</p>
</div>
</div>

<div class="loginContent">
<div class="inputRow">
<textarea id="promptBox" placeholder="Type your prompt" spellcheck="false"></textarea>
<button id="sendBtn" class="sendBtn" type="button">
<svg viewBox="0 0 24 24">
<path d="M2 21L23 12L2 3V10L17 12L2 14V21Z"></path>
</svg>
</button>
</div>
</div>
</div>
</div>

<!-- MAIN APP -->
<div class="main">

<nav class="navbar">
<div class="navContainer">
<div class="navLinks">
<a href="/projects.html#" class="navLink" style="display: flex; align-items: center; gap: 12px;">← My Projects</a>
</div>
<div class="userInfo">
<span id="projectName" style="color: var(--accent); margin-right: 16px; font-size: 13px; font-weight: 500;"></span>
<span id="userName">User</span>
<button id="logoutBtn" class="logoutBtn">Logout</button>
</div>
</div>
</nav>

<!-- DEBATE PAGE -->
<div id="debatePage" class="debatePage">
<!-- THREE COLUMN LAYOUT -->
<div class="debateMainContainer">
<!-- LEFT PANEL: UPLOADED FILES -->
<div class="leftPanel">
<div class="panelHeader">
<h3>Uploaded Files</h3>
</div>
<div id="uploadedFilesList" class="filesList">
<p style="color: var(--text3); font-size: 13px; padding: 16px;">No files uploaded</p>
</div>
</div>

<!-- CENTER: MAIN INTERFACE -->
<div class="centerPanel">
<div class="header">
<img src="v1-01.png" class="logo">

<div class="titleBlock">
<h1>Cosine <span class="gradient-text">1.4</span></h1>
<p class="subtitle">Make decisions more powerful.</p>
</div>
</div>

<!-- AGENT SELECTION PANEL -->
<div id="agentSelectionPanel" class="agentSelectionPanel">
<div class="agentPanelContent">
<h3>Active Agents</h3>
<div class="agents-select">
<button class="agent-toggle active-cfo" data-agent="cfo">CFO</button>
<button class="agent-toggle active-ops" data-agent="ops">Operations</button>
<button class="agent-toggle active-mkt" data-agent="mkt">Market</button>
<button class="agent-toggle active-dev" data-agent="dev">Devil's Advocate</button>
</div>
</div>
</div>

<div id="chatContainer" class="chatContainer hidden"></div>

<!-- SUMMARY SECTION -->
<div id="summarySection" class="summarySection hidden">
<div class="summaryContent">
<h4>📝 Summary</h4>
<div id="summaryList" class="summaryList"></div>
</div>
</div>

<div class="inputRow">
<textarea id="promptBox" placeholder="Type your prompt" spellcheck="false"></textarea>
<button id="pauseBtn" class="pauseBtn hidden" type="button">⏸ Pause</button>
<button id="resumeBtn" class="resumeBtn hidden" type="button">▶ Resume</button>
<button id="sendBtn" class="sendBtn" type="button">
<svg viewBox="0 0 24 24">
<path d="M2 21L23 12L2 3V10L17 12L2 14V21Z"></path>
</svg>
</button>
<div id="messageLimit" class="messageLimit hidden"></div>
</div>
</div>

<!-- RIGHT PANEL: SETTINGS -->
<div class="rightPanel">
<div class="panelHeader">
<h3>Settings</h3>
</div>
<div class="settingsContent">
<div class="settingGroup">
<label for="messageSlider" style="color: var(--text2); font-size: 12px; display: block; margin-bottom: 8px;">
Number of messages:
</label>
<div style="display: flex; align-items: center; gap: 8px;">
<input type="range" id="messageSlider" min="5" max="50" value="10" class="settingsSlider">
<span id="messageCount" style="color: var(--text); font-size: 13px; min-width: 30px;">10</span>
</div>
</div>

<div class="settingGroup">
<label style="color: var(--text2); font-size: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer;">
<input type="checkbox" id="webSearchCheckbox" class="settingsCheckbox">
<span>Use web search</span>
</label>
</div>
</div>
</div>
</div>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="historyPage">
<div class="historyContainer">
<h2>Your Debate History</h2>
<div id="historyList" class="historyList"></div>
</div>
</div>

<!-- DEBATE DETAIL VIEW -->
<div id="debateDetailPage" class="debateDetailPage">
<div class="debateDetailContainer">
<button class="backBtn" onclick="showHistoryPage(event)">← Back to History</button>
<div id="debateDetail" class="debateDetail"></div>
</div>
</div>

</div>

<div class="credit">
<img src="feaven.png">
<span>Feaven</span>
</div>

<script src="c1.js"></script>

</body>
</html>
