<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Plan - Cosine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <script>
        // Redirect to signin only if NOT logged in
        if (!localStorage.getItem('authToken')) {
            window.location.href = 'signin.html';
        }
    </script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #000000;
            --bg2: #070707;
            --bg3: #0a0a0a;
            --surface: rgba(255,255,255,0.03);
            --surface2: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --text: #f0eef8;
            --text2: rgba(240,238,248,0.5);
            --text3: rgba(240,238,248,0.26);
            --accent: #c8b4f0;
            --accent2: #f4a8c7;
            --accent3: #7dd4b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: #000000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .plan-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .plan-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .plan-header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 40px;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .plan-header p {
            color: var(--text2);
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .plan-card {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 16px;
            padding: 32px 24px;
            transition: all 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .plan-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            background: rgba(200, 180, 240, 0.02);
        }

        .plan-card.recommended {
            border-color: var(--accent);
            background: rgba(200, 180, 240, 0.05);
            transform: scale(1.02);
        }

        .plan-card.selected {
            border-color: var(--accent3);
            background: rgba(125, 212, 184, 0.05);
        }

        .plan-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(125, 212, 184, 0.1);
            border: 1px solid rgba(125, 212, 184, 0.3);
            color: var(--accent3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .plan-name {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: 'Instrument Serif', serif;
        }

        .plan-price {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .plan-price-period {
            color: var(--text3);
            font-size: 12px;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .plan-description {
            color: var(--text2);
            font-size: 13px;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .plan-features {
            list-style: none;
            margin-bottom: 24px;
        }

        .plan-features li {
            padding: 8px 0;
            font-size: 13px;
            color: var(--text2);
            border-bottom: 1px solid var(--border);
        }

        .plan-features li:last-child {
            border-bottom: none;
        }

        .plan-features li::before {
            content: '• ';
            color: var(--accent3);
            font-weight: 500;
        }

        .btn-select {
            width: 100%;
            padding: 12px 24px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border2);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }

        .plan-card:hover .btn-select {
            border-color: var(--accent);
            color: var(--accent);
        }

        .plan-card.selected .btn-select {
            background: var(--accent3);
            color: #000;
            border-color: var(--accent3);
        }

        .plan-card.recommended .btn-select {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .btn-select:hover {
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text2);
            font-size: 14px;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: rgba(200, 180, 240, 0.05);
            border: 1px solid rgba(200, 180, 240, 0.2);
            padding: 16px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: var(--text2);
            margin-top: 40px;
        }

        .error-message {
            background: rgba(244, 120, 120, 0.1);
            border: 1px solid rgba(244, 120, 120, 0.3);
            padding: 16px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #f47878;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="plan-container">
        <div class="plan-header">
            <h1>Choose Your Plan</h1>
            <p>Select the perfect plan to unlock Cosine's full potential. You can upgrade or downgrade anytime.</p>
        </div>

        <div class="plans-grid" id="plansGrid">
            <!-- Plans will be dynamically rendered here -->
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="info-box" id="infoBox" style="display: none;">
            Complete your payment below. Your plan will be activated automatically once PayPal confirms the transaction.
        </div>

        <!-- PayPal Buttons Container -->
        <div id="paypalContainer" style="display: none; max-width: 500px; margin: 40px auto;">
            <div id="paypal-button-container"></div>
        </div>

        <!-- Free Plan Direct Access -->
        <div id="freeConfirm" style="display: none; text-align: center; margin-top: 40px;">
            <button class="btn-select" style="max-width: 300px; margin: 0 auto; display: block; background: var(--accent); color: #000; border-color: var(--accent);" onclick="activateFreePlan()">Activate Free Plan</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div style="margin-top: 12px;">Processing...</div>
        </div>
    </div>

    <script>
        // Dynamically load PayPal SDK with correct client ID
        function loadPayPalSDK() {
            const clientId = 'AfVpYXeLnq2DP7QmrVpQYATc1iXxfuej_N63H7hgV3Fs--jsPw3VuEFpe-GEbQLIr6A3R1wnaaUZBoaN';
            const script = document.createElement('script');
            script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
            script.async = true;
            script.onload = () => {
                console.log('✓ PayPal SDK loaded successfully');
            };
            script.onerror = () => {
                console.error('✗ Failed to load PayPal SDK');
                showError('Failed to load PayPal. Please refresh and try again.');
            };
            document.body.appendChild(script);
        }

        // Load PayPal SDK when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPayPalSDK);
        } else {
            loadPayPalSDK();
        }
    </script>

    <script>
        let selectedPlan = 'Free';
        let paypalInitialized = false;
        let PLAN_DATA = {};
        let PLAN_PRICES = {};

        // ─────────────────────────────────────────────
        // Load Plans from Server
        // ─────────────────────────────────────────────
        async function loadPlansFromServer() {
            try {
                const response = await fetch(getApiUrl('/api/plan-prices'), {
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.plans) {
                    PLAN_DATA = data;
                    PLAN_PRICES = data.prices;
                    console.log('✓ Plans loaded from server:', PLAN_DATA);
                    renderPlans(data.plans);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Failed to load plans:', error);
                showError('Could not load plan prices. Please refresh the page.');
                // Render with hardcoded fallback
                renderFallbackPlans();
            }
        }

        // ─────────────────────────────────────────────
        // Render Plans
        // ─────────────────────────────────────────────
        function renderPlans(plans) {
            const grid = document.getElementById('plansGrid');
            grid.innerHTML = '';
            
            const featuresMap = {
                'Free': ['Up to 3 Projects', 'Basic AI Features', 'Limited Debates', 'Email Support'],
                'Pro': ['Unlimited Projects', 'Advanced AI Features', 'Unlimited Debates', 'Priority Support', 'Export Features'],
                'Master': ['Everything in Pro', 'Team Collaboration', 'Advanced Analytics', 'Custom Integrations', 'Dedicated Support']
            };

            plans.forEach((plan, index) => {
                const isRecommended = plan.plan_name === 'Pro';
                const isSelected = plan.plan_name === 'Free';
                const price = plan.price_usd || 0;
                const features = featuresMap[plan.plan_name] || ['Coming soon...'];

                const card = document.createElement('div');
                card.className = `plan-card${isRecommended ? ' recommended' : ''}${isSelected ? ' selected' : ''}`;
                card.id = `${plan.plan_name.toLowerCase()}Card`;
                card.dataset.plan = plan.plan_name;
                card.onclick = () => selectPlan(plan.plan_name, card);

                card.innerHTML = `
                    ${isRecommended ? '<div class="plan-badge">Recommended</div>' : ''}
                    <div class="plan-name">${plan.plan_name}</div>
                    <div class="plan-price">${price === 0 ? 'Free' : '$' + Math.floor(price)}</div>
                    <div class="plan-price-period">${price === 0 ? 'Forever Free' : 'Per Month'}</div>
                    <div class="plan-description">${plan.description || ''}</div>
                    <ul class="plan-features">
                        ${features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                    <button type="button" class="btn-select" onclick="event.stopPropagation(); selectPlan('${plan.plan_name}', this.closest('.plan-card'))">
                        ${isSelected ? 'Selected' : `Select ${plan.plan_name}`}
                    </button>
                `;

                grid.appendChild(card);
            });

            // Select Free plan by default
            const freeCard = document.getElementById('freeCard');
            if (freeCard) {
                selectPlan('Free', freeCard);
            }
        }

        function renderFallbackPlans() {
            const fallbackPlans = [
                { plan_name: 'Free', price_usd: 0, description: 'Forever Free' },
                { plan_name: 'Pro', price_usd: 32, description: 'For power users who want more' },
                { plan_name: 'Master', price_usd: 92, description: 'For teams and enterprises' }
            ];
            renderPlans(fallbackPlans);
        }

        // ─────────────────────────────────────────────
        // Plan Selection
        // ─────────────────────────────────────────────
        function selectPlan(planName, cardElement) {
            // Remove selected class from all cards
            document.querySelectorAll('.plan-card.selected').forEach(card => {
                card.classList.remove('selected');
            });

            // Add selected class to current card
            if (cardElement) {
                cardElement.classList.add('selected');
            }
            selectedPlan = planName;

            // Update button text
            document.querySelectorAll('.plan-card .btn-select').forEach(btn => {
                const card = btn.closest('.plan-card');
                if (card && card.dataset.plan === planName) {
                    btn.textContent = 'Selected';
                } else if (card) {
                    btn.textContent = `Select ${card.dataset.plan}`;
                }
            });

            // Show appropriate UI based on plan
            updatePaymentUI(planName);
        }

        function updatePaymentUI(planName) {
            const paypalContainer = document.getElementById('paypalContainer');
            const freeConfirm = document.getElementById('freeConfirm');
            const infoBox = document.getElementById('infoBox');
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.classList.remove('show');
            errorMsg.textContent = '';

            if (planName === 'Free') {
                paypalContainer.style.display = 'none';
                freeConfirm.style.display = 'block';
                infoBox.style.display = 'none';
            } else {
                freeConfirm.style.display = 'none';
                infoBox.style.display = 'block';
                paypalContainer.style.display = 'block';
                
                // Initialize PayPal buttons if not already done
                if (!paypalInitialized) {
                    initializePayPal();
                    paypalInitialized = true;
                }
            }
        }

        // ─────────────────────────────────────────────
        // Free Plan Activation
        // ─────────────────────────────────────────────
        async function activateFreePlan() {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.user_id) {
                window.location.href = '/signin.html';
                return;
            }

            try {
                showLoading(true);
                hideError();

                const response = await fetch(getApiUrl('/user/update-plan'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ plan: 'Free' })
                });

                const data = await response.json();

                if (response.status === 401) {
                    clearAuthSession();
                    window.location.href = '/signin.html';
                    return;
                }

                if (response.ok) {
                    user.plan = 'Free';
                    if (data.user?.subscription_end_date) {
                        user.subscription_end_date = data.user.subscription_end_date;
                    }
                    localStorage.setItem('user', JSON.stringify(user));
                    window.location.href = '/projects.html';
                } else {
                    showError(data.detail || 'Failed to activate free plan');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // ─────────────────────────────────────────────
        // PayPal Integration
        // ─────────────────────────────────────────────
        async function initializePayPal() {
            try {
                // Wait for PayPal SDK to load
                let attempts = 0;
                while (typeof paypal === 'undefined' && attempts < 50) {
                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }
                
                if (typeof paypal === 'undefined') {
                    throw new Error('PayPal SDK failed to load');
                }
                
                // Render PayPal buttons
                paypal.Buttons({
                    createOrder: async (data, actions) => {
                        try {
                            const orderId = await createPayPalOrder();
                            console.log('✓ PayPal order created:', orderId);
                            return orderId;
                        } catch (error) {
                            console.error('✗ Order creation failed:', error.message);
                            showError(error.message);
                            throw error;
                        }
                    },
                    onApprove: async (data, actions) => {
                        try {
                            showLoading(true);
                            hideError();
                            
                            console.log('✓ Payment approved for order:', data.orderID);
                            const result = await capturePayPalOrder(data.orderID);
                            console.log('✓ Capture result:', result);
                            
                            if (result.status === 'COMPLETED') {
                                const user = JSON.parse(localStorage.getItem('user') || '{}');
                                user.plan = result.plan || selectedPlan;
                                if (result.subscription_end_date) {
                                    user.subscription_end_date = result.subscription_end_date;
                                }
                                localStorage.setItem('user', JSON.stringify(user));
                                window.location.href = '/projects.html';
                            } else if (result.status === 'PENDING') {
                                await pollForPlanActivation();
                                window.location.href = '/projects.html';
                            } else {
                                await pollForPlanActivation();
                                window.location.href = '/projects.html';
                            }
                        } catch (error) {
                            console.error('✗ Payment capture failed:', error.message);
                            showError('Payment processing error: ' + error.message);
                        } finally {
                            showLoading(false);
                        }
                    },
                    onError: (err) => {
                        console.error('✗ PayPal error:', err);
                        showError(`Payment failed: ${err.message || 'Please try again.'}`);
                    },
                    onCancel: () => {
                        console.log('Payment cancelled by user');
                    }
                }).render('#paypal-button-container');
                
                console.log('✓ PayPal buttons rendered successfully');
            } catch (error) {
                console.error('PayPal initialization error:', error);
                showError('Failed to load PayPal. Please refresh and try again.');
            }
        }

        async function createPayPalOrder() {
            const token = localStorage.getItem('authToken');
            const amount = PLAN_PRICES[selectedPlan] || 0;

            if (amount <= 0) {
                throw new Error('Invalid plan price');
            }

            try {
                console.log(`Creating PayPal order for ${selectedPlan} ($${amount})`);
                
                const response = await fetch(getApiUrl('/payments/create-paypal-order'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ 
                        plan: selectedPlan,
                        amount: amount.toFixed(2)
                    })
                });

                const data = await response.json();
                
                console.log('Backend response:', { status: response.status, data });

                if (response.ok && data.order_id) {
                    console.log('✓ Order ID received:', data.order_id);
                    return data.order_id;
                } else {
                    const errorMsg = data.detail || data.error || 'Failed to create order';
                    console.error('Backend error:', errorMsg);
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error('Create order error:', error.message);
                throw error;
            }
        }

        async function capturePayPalOrder(orderId) {
            const token = localStorage.getItem('authToken');

            try {
                console.log('Capturing PayPal order:', orderId);

                const response = await fetch(getApiUrl('/payments/capture-paypal-order'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ order_id: orderId })
                });

                const data = await response.json();
                console.log('Capture response:', { status: response.status, data });

                if (response.ok && data.success) {
                    if (data.plan && data.status === 'COMPLETED') {
                        const user = JSON.parse(localStorage.getItem('user') || '{}');
                        user.plan = data.plan;
                        localStorage.setItem('user', JSON.stringify(user));
                    }
                    return data;
                } else {
                    const errorMsg = data.detail || data.error || 'Failed to capture payment';
                    console.error('Capture error:', errorMsg);
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error('Capture request error:', error.message);
                throw error;
            }
        }

        async function pollForPlanActivation(maxAttempts = 12) {
            const token = localStorage.getItem('authToken');
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                try {
                    const response = await fetch(getApiUrl('/user/me'), {
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'ngrok-skip-browser-warning': 'true'
                        }
                    });

                    const data = await response.json();
                    
                    if (response.ok && data.user?.plan === selectedPlan) {
                        const user = JSON.parse(localStorage.getItem('user') || '{}');
                        user.plan = data.user.plan;
                        if (data.user.subscription_end_date) {
                            user.subscription_end_date = data.user.subscription_end_date;
                        }
                        localStorage.setItem('user', JSON.stringify(user));
                        return true;
                    }
                } catch (e) {
                    console.log('Poll attempt', attempt + 1, 'failed');
                }

                if (attempt < maxAttempts - 1) {
                    await new Promise(r => setTimeout(r, 5000));
                }
            }

            return true;
        }

        // ─────────────────────────────────────────────
        // UI Helpers
        // ─────────────────────────────────────────────
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('show');
        }

        function hideError() {
            const el = document.getElementById('errorMessage');
            el.classList.remove('show');
            el.textContent = '';
        }

        function clearAuthSession() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
        }

        // ─────────────────────────────────────────────
        // Initialize
        // ─────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.user_id) {
                window.location.href = '/signin.html';
                return;
            }
            loadPlansFromServer();
        });
    </script>
</body>
</html>
