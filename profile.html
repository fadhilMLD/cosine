<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Cosine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #000000;
            --bg2: #070707;
            --bg3: #0a0a0a;
            --surface: rgba(255,255,255,0.03);
            --surface2: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --text: #f0eef8;
            --text2: rgba(240,238,248,0.5);
            --text3: rgba(240,238,248,0.26);
            --accent: #c8b4f0;
            --accent2: #f4a8c7;
            --accent3: #7dd4b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: #000000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(32px);
        }

        .logo-link { transition: opacity 0.2s; }
        .logo-link:hover { opacity: 0.8; }

        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            font-weight: 400;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }

        .back-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .main-content {
            padding: 100px 40px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header { margin-bottom: 40px; }
        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 8px;
        }
        .header p { color: var(--text2); font-size: 14px; }

        .section {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            font-family: 'Instrument Serif', serif;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 8px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(200, 180, 240, 0.05);
        }
        input[type="text"]:disabled {
            background: var(--surface);
            color: var(--text3);
            cursor: not-allowed;
        }

        select option { background: #111; color: var(--text); }

        .plan-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .plan-display:last-child { border-bottom: none; }

        .plan-info { flex: 1; }
        .plan-name { font-weight: 500; margin-bottom: 4px; }
        .plan-price { font-size: 12px; color: var(--text2); }

        .plan-badge {
            background: rgba(200, 180, 240, 0.1);
            border: 1px solid rgba(200, 180, 240, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary:hover { background: #d4c0f6; transform: translateY(-1px); }
        .btn-primary:disabled {
            background: var(--surface2);
            color: var(--text3);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        /* ── toast messages ── */
        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .toast.show { display: block; }

        .toast-success {
            background: rgba(125, 212, 184, 0.1);
            border: 1px solid rgba(125, 212, 184, 0.3);
            color: var(--accent3);
        }
        .toast-error {
            background: rgba(244, 168, 199, 0.1);
            border: 1px solid rgba(244, 168, 199, 0.3);
            color: var(--accent2);
        }
        .toast-info {
            background: rgba(200, 180, 240, 0.08);
            border: 1px solid rgba(200, 180, 240, 0.2);
            color: var(--accent);
        }

        /* ── pending purchase banner ── */
        #pendingBanner {
            display: none;
            background: rgba(200, 180, 240, 0.08);
            border: 1px solid rgba(200, 180, 240, 0.25);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        #pendingBanner.show { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .pending-text { font-size: 13px; color: var(--accent); line-height: 1.5; }
        .pending-text strong { display: block; margin-bottom: 2px; font-weight: 500; }
        #verifyPurchaseBtn {
            white-space: nowrap;
            flex-shrink: 0;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 7px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #verifyPurchaseBtn:hover { background: rgba(200,180,240,0.1); }
        #verifyPurchaseBtn:disabled { opacity: 0.5; cursor: not-allowed; }

        .subscription-info {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text2);
            padding: 10px 12px;
            background: var(--surface);
            border-radius: 7px;
            display: none;
        }
        .subscription-info.show { display: block; }

        .loading {
            display: none;
            text-align: center;
            padding: 16px;
            color: var(--text2);
            font-size: 13px;
        }
        .loading.show { display: block; }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <a href="projects.html" class="logo-link" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
        <img src="v1-01.png" alt="Cosine Logo" style="width:30px;height:30px;object-fit:contain;">
        <div class="logo">Cosine</div>
    </a>
    <div class="nav-right">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
</nav>

<div class="main-content">
    <div class="header">
        <h1>Profile</h1>
        <p>Manage your account settings and plan</p>
    </div>

    <!-- Pending purchase banner (persists across page loads) -->
    <div id="pendingBanner">
        <div class="pending-text">
            <strong>Purchase in progress</strong>
            Complete your payment on Gumroad, then click Verify to activate your plan.
        </div>
        <button id="verifyPurchaseBtn" onclick="verifyPendingPurchase()">Verify Purchase</button>
    </div>

    <!-- Feedback toasts -->
    <div class="toast toast-success" id="toastSuccess"></div>
    <div class="toast toast-error"   id="toastError"></div>
    <div class="toast toast-info"    id="toastInfo"></div>

    <!-- Personal Information -->
    <div class="section">
        <h2 class="section-title">Personal Information</h2>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" disabled>
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name">
        </div>
        <button class="btn-primary" id="updateNameBtn" onclick="updateName()">Update Name</button>
        <div class="loading" id="nameLoading"><span class="spinner"></span>Updating...</div>
    </div>

    <!-- Billing Plan -->
    <div class="section">
        <h2 class="section-title">Billing Plan</h2>
        <div class="plan-display">
            <div class="plan-info">
                <div class="plan-name">Current Plan</div>
                <div class="plan-price" id="currentPlanName">Free Plan</div>
            </div>
            <div class="plan-badge" id="currentPlanBadge">Free</div>
        </div>

        <div class="subscription-info" id="subscriptionInfo" id="subscriptionEndDate"></div>

        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
            <div class="form-group">
                <label for="planSelect">Change Plan</label>
                <select id="planSelect">
                    <option value="Free">Free — $0 / month</option>
                    <option value="Pro">Pro — $9 / month</option>
                    <option value="Master">Master — $19 / month</option>
                </select>
            </div>
            <div class="form-group">
                <label for="couponCode">Coupon Code</label>
                <input type="text" id="couponCode" placeholder="Optional coupon code">
            </div>
            <button class="btn-primary" id="upgradePlanBtn" onclick="upgradePlan()">Update Plan</button>
            <div class="loading" id="planLoading"><span class="spinner"></span>Processing...</div>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadProfile();
    checkPendingPurchase();
});

function checkAuth() {
    const token = localStorage.getItem('authToken');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token || !user.user_id) window.location.href = '/signin.html';
}

function loadProfile() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    document.getElementById('email').value = user.email || '';
    document.getElementById('name').value  = user.name  || '';

    const plan = user.plan || 'Free';
    document.getElementById('currentPlanName').textContent  = plan + ' Plan';
    document.getElementById('currentPlanBadge').textContent = plan;
    document.getElementById('planSelect').value = plan;

    const infoEl = document.getElementById('subscriptionInfo');
    if (user.subscription_end_date && plan !== 'Free') {
        const formatted = new Date(user.subscription_end_date).toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric'
        });
        infoEl.textContent = `Active until ${formatted}`;
        infoEl.classList.add('show');
    } else {
        infoEl.classList.remove('show');
    }
}

// ─────────────────────────────────────────────
// Pending purchase banner
// ─────────────────────────────────────────────
function checkPendingPurchase() {
    const pendingPlan = sessionStorage.getItem('pendingPlan');
    if (pendingPlan) {
        document.getElementById('pendingBanner').classList.add('show');
    }
}

function dismissPendingBanner() {
    sessionStorage.removeItem('pendingPlan');
    sessionStorage.removeItem('pendingCoupon');
    document.getElementById('pendingBanner').classList.remove('show');
}

// ─────────────────────────────────────────────
// Update name
// ─────────────────────────────────────────────
async function updateName() {
    const token = localStorage.getItem('authToken');
    const name  = document.getElementById('name').value.trim();
    if (!name) { showError('Please enter a name'); return; }

    try {
        setNameLoading(true);
        clearToasts();

        const res  = await fetch(getApiUrl('/user/update-name'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ name })
        });
        const data = await res.json();

        if (res.ok) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.name = name;
            localStorage.setItem('user', JSON.stringify(user));
            showSuccess('Name updated successfully');
        } else {
            showError(data.detail || 'Failed to update name');
        }
    } catch (e) {
        showError('Network error: ' + e.message);
    } finally {
        setNameLoading(false);
    }
}

// ─────────────────────────────────────────────
// Upgrade plan
// ─────────────────────────────────────────────
async function upgradePlan() {
    const user      = JSON.parse(localStorage.getItem('user') || '{}');
    const newPlan   = document.getElementById('planSelect').value;
    const coupon    = document.getElementById('couponCode').value.trim();
    const hierarchy = { Free: 0, Pro: 1, Master: 2 };

    if (newPlan === (user.plan || 'Free')) {
        showError('Please select a different plan');
        return;
    }
    if ((hierarchy[newPlan] || 0) < (hierarchy[user.plan] || 0)) {
        showError(`Cannot downgrade from ${user.plan} to ${newPlan}. Upgrades only.`);
        return;
    }

    if (newPlan === 'Free') {
        await updatePlanDirect('Free', coupon);
        return;
    }

    await initiatePayment(newPlan, coupon);
}

async function initiatePayment(plan, coupon) {
    const token = localStorage.getItem('authToken');

    try {
        setPlanLoading(true);
        clearToasts();

        const res  = await fetch(getApiUrl('/payments/create-order'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ plan, coupon_code: coupon || null })
        });
        const data = await res.json();

        if (!res.ok) {
            showError(data.detail || 'Failed to get payment link');
            return;
        }

        // Coupon made it free — activate directly
        if (!data.requires_payment || Number(data.amount || 0) <= 0) {
            await updatePlanDirect(plan, coupon);
            return;
        }

        // Store pending state and open Gumroad
        sessionStorage.setItem('pendingPlan',   plan);
        sessionStorage.setItem('pendingCoupon', coupon || '');

        showInfo(`Opening Gumroad checkout for ${plan} Plan. Complete the payment, then click Verify Purchase.`);
        document.getElementById('pendingBanner').classList.add('show');

        setTimeout(() => window.open(data.payment_url, '_blank'), 800);

    } catch (e) {
        showError('Error initiating payment: ' + e.message);
    } finally {
        setPlanLoading(false);
    }
}

// ─────────────────────────────────────────────
// Verify purchase (called manually by user OR
// auto-called if webhook already activated it)
// ─────────────────────────────────────────────
async function verifyPendingPurchase() {
    const pendingPlan   = sessionStorage.getItem('pendingPlan');
    const pendingCoupon = sessionStorage.getItem('pendingCoupon');

    if (!pendingPlan) {
        showError('No pending purchase found. Please start the upgrade process again.');
        return;
    }

    clearToasts();
    const btn = document.getElementById('verifyPurchaseBtn');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
        const token = localStorage.getItem('authToken');
        const res   = await fetch(getApiUrl('/payments/verify'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ plan: pendingPlan, coupon_code: pendingCoupon || null })
        });
        const data = await res.json();

        if (res.ok) {
            // Update local cache
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.plan  = pendingPlan;
            if (data.user?.subscription_end_date) {
                user.subscription_end_date = data.user.subscription_end_date;
            }
            localStorage.setItem('user', JSON.stringify(user));

            dismissPendingBanner();
            loadProfile();

            const msg = data.message === 'Plan already active'
                ? `${pendingPlan} plan is active — you are all set!`
                : data.coupon?.applied
                    ? `Plan upgraded to ${pendingPlan} with coupon ${data.coupon.code}!`
                    : `Plan upgraded to ${pendingPlan} successfully!`;
            showSuccess(msg);

        } else {
            // Webhook may not have fired yet — keep banner, show guidance
            showError((data.detail || 'Verification failed') + ' — if you just paid, please wait a moment and try again.');
        }
    } catch (e) {
        showError('Network error: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Verify Purchase';
    }
}

// ─────────────────────────────────────────────
// Direct plan update (free / coupon-100%)
// ─────────────────────────────────────────────
async function updatePlanDirect(plan, coupon) {
    const token = localStorage.getItem('authToken');

    try {
        setPlanLoading(true);
        clearToasts();

        const res  = await fetch(getApiUrl('/user/update-plan'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ plan, coupon_code: coupon || null })
        });
        const data = await res.json();

        if (res.ok) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.plan  = plan;
            if (data.user?.subscription_end_date) {
                user.subscription_end_date = data.user.subscription_end_date;
            }
            localStorage.setItem('user', JSON.stringify(user));
            loadProfile();
            showSuccess(data.coupon?.applied
                ? `Plan updated to ${plan} with coupon ${data.coupon.code}!`
                : 'Plan updated successfully!');
        } else {
            showError(data.detail || 'Failed to update plan');
        }
    } catch (e) {
        showError('Network error: ' + e.message);
    } finally {
        setPlanLoading(false);
    }
}

// ─────────────────────────────────────────────
// Auth helpers
// ─────────────────────────────────────────────
function clearAuthSession() {
    localStorage.removeItem('authToken');
    localStorage.removeItem('user');
    sessionStorage.removeItem('pendingPlan');
    sessionStorage.removeItem('pendingCoupon');
}

function handleLogout() {
    clearAuthSession();
    window.location.href = '/signin.html';
}

function goBack() {
    window.location.href = '/projects.html';
}

// ─────────────────────────────────────────────
// Toast helpers
// ─────────────────────────────────────────────
function showSuccess(msg) {
    clearToasts();
    const el = document.getElementById('toastSuccess');
    el.textContent = msg;
    el.classList.add('show');
}

function showError(msg) {
    clearToasts();
    const el = document.getElementById('toastError');
    el.textContent = msg;
    el.classList.add('show');
}

function showInfo(msg) {
    clearToasts();
    const el = document.getElementById('toastInfo');
    el.textContent = msg;
    el.classList.add('show');
}

function clearToasts() {
    ['toastSuccess', 'toastError', 'toastInfo'].forEach(id => {
        document.getElementById(id).classList.remove('show');
    });
}

// ─────────────────────────────────────────────
// Loading state helpers
// ─────────────────────────────────────────────
function setNameLoading(on) {
    document.getElementById('nameLoading').classList.toggle('show', on);
    document.getElementById('updateNameBtn').disabled = on;
}

function setPlanLoading(on) {
    document.getElementById('planLoading').classList.toggle('show', on);
    document.getElementById('upgradePlanBtn').disabled = on;
}
</script>
</body>
</html>
