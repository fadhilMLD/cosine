<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Cosine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #000000;
            --bg2: #070707;
            --bg3: #0a0a0a;
            --surface: rgba(255,255,255,0.03);
            --surface2: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --text: #f0eef8;
            --text2: rgba(240,238,248,0.5);
            --text3: rgba(240,238,248,0.26);
            --accent: #c8b4f0;
            --accent2: #f4a8c7;
            --accent3: #7dd4b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: #000000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(32px);
        }

        .logo-link {
            transition: opacity 0.2s;
        }

        .logo-link:hover {
            opacity: 0.8;
        }

        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            font-weight: 400;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-content {
            padding: 100px 40px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text2);
            font-size: 14px;
        }

        .section {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            font-family: 'Instrument Serif', serif;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 8px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(200, 180, 240, 0.05);
        }

        input[type="text"]:disabled {
            background: var(--surface);
            color: var(--text3);
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .plan-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .plan-display:last-child {
            border-bottom: none;
        }

        .plan-info {
            flex: 1;
        }

        .plan-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .plan-price {
            font-size: 12px;
            color: var(--text2);
        }

        .plan-badge {
            background: rgba(200, 180, 240, 0.1);
            border: 1px solid rgba(200, 180, 240, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background: #d4c0f6;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--surface2);
            color: var(--text3);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .success-message {
            background: rgba(125, 212, 184, 0.1);
            border: 1px solid rgba(125, 212, 184, 0.3);
            color: var(--accent3);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            background: rgba(244, 168, 199, 0.1);
            border: 1px solid rgba(244, 168, 199, 0.3);
            color: var(--accent2);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .button-group button {
            flex: 1;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text2);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="projects.html" class="logo-link" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
            <img src="v1-01.png" alt="Cosine Logo" style="width: 30px; height: 30px; object-fit: contain;">
            <div class="logo">Cosine</div>
        </a>
        <div class="nav-right">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Profile</h1>
            <p>Manage your account settings and plan</p>
        </div>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <!-- Profile Section -->
        <div class="section">
            <h2 class="section-title">Personal Information</h2>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" disabled>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your name">
            </div>
            <button class="btn-primary" onclick="updateName()">Update Name</button>
            <div class="loading" id="nameLoading">
                <div class="spinner"></div>
                <div style="margin-top: 8px;">Updating...</div>
            </div>
        </div>

        <!-- Plan Section -->
        <div class="section">
            <h2 class="section-title">Billing Plan</h2>
            <div class="plan-display">
                <div class="plan-info">
                    <div class="plan-name">Current Plan</div>
                    <div class="plan-price" id="currentPlanName">Free Plan</div>
                </div>
                <div class="plan-badge" id="currentPlanBadge">Free</div>
            </div>

            <!-- Subscription Info -->
            <div id="subscriptionInfo" style="display: none; margin-top: 15px; padding: 12px; background-color: var(--secondary); border-radius: 8px;">
                <div style="font-size: 13px; color: var(--text-secondary);" id="subscriptionEndDate"></div>
            </div>
            
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                <label for="planSelect">Change Plan</label>
                <select id="planSelect">
                    <option value="Free">Free - ₹0/month</option>
                    <option value="Pro">Pro - ₹499/month</option>
                    <option value="Master">Master - ₹1299/month</option>
                </select>
                <button class="btn-primary" onclick="upgradePlan()" style="margin-top: 12px;">Update Plan</button>
                <div class="loading" id="planLoading">
                    <div class="spinner"></div>
                    <div style="margin-top: 8px;">Processing...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadProfile();
        });

        function checkAuth() {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.user_id) {
                window.location.href = '/signin.html';
                return;
            }
        }

        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            document.getElementById('email').value = user.email || '';
            document.getElementById('name').value = user.name || '';
            document.getElementById('currentPlanName').textContent = (user.plan || 'Free') + ' Plan';
            document.getElementById('currentPlanBadge').textContent = user.plan || 'Free';
            document.getElementById('planSelect').value = user.plan || 'Free';

            // Display subscription end date if available
            const endDateEl = document.getElementById('subscriptionEndDate');
            if (endDateEl) {
                if (user.subscription_end_date) {
                    const endDate = new Date(user.subscription_end_date);
                    const formatted = endDate.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric' 
                    });
                    endDateEl.textContent = `Renews on ${formatted}`;
                    document.getElementById('subscriptionInfo').style.display = 'block';
                } else if (user.plan !== 'Free') {
                    endDateEl.textContent = 'Loading subscription details...';
                    document.getElementById('subscriptionInfo').style.display = 'block';
                } else {
                    document.getElementById('subscriptionInfo').style.display = 'none';
                }
            }
        }

        async function updateName() {
            const token = localStorage.getItem('authToken');
            const name = document.getElementById('name').value.trim();

            if (!name) {
                showError('Please enter a name');
                return;
            }

            try {
                showNameLoading(true);
                clearMessages();

                const response = await fetch(getApiUrl('/user/update-name'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name })
                });

                const data = await response.json();

                if (response.ok) {
                    // Update local storage
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    user.name = name;
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    showSuccess('Name updated successfully');
                } else {
                    showError(data.detail || 'Failed to update name');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showNameLoading(false);
            }
        }

        async function upgradePlan() {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const newPlan = document.getElementById('planSelect').value;

            if (newPlan === user.plan) {
                showError('Please select a different plan');
                return;
            }

            // Plan hierarchy: Free < Pro < Master
            const planHierarchy = {
                'Free': 0,
                'Pro': 1,
                'Master': 2
            };

            const currentPlanLevel = planHierarchy[user.plan] || 0;
            const newPlanLevel = planHierarchy[newPlan] || 0;

            // Check if attempting to downgrade
            if (newPlanLevel < currentPlanLevel) {
                showError(`Cannot downgrade from ${user.plan} to ${newPlan}. Upgrades only allowed.`);
                return;
            }

            // Plan prices in paise (multiply by 100)
            const planPrices = {
                'Free': 0,
                'Pro': 49900,  // ₹499
                'Master': 129900  // ₹1299
            };

            const price = planPrices[newPlan];

            if (price === 0) {
                // Free plan - no payment needed
                await updatePlanDirect(newPlan);
            } else {
                // Paid plan - initiate payment
                initiatePayment(newPlan, price);
            }
        }

        async function initiatePayment(plan, price) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const token = localStorage.getItem('authToken');

            try {
                showPlanLoading(true);
                
                // Create order on backend
                const orderResponse = await fetch(getApiUrl('/payments/create-order'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        plan,
                        amount: price
                    })
                });

                const orderData = await orderResponse.json();
                
                if (!orderResponse.ok) {
                    showError(orderData.detail || 'Failed to create order');
                    showPlanLoading(false);
                    return;
                }

                const options = {
                    key: "rzp_test_StFoGX0LfzHlPa",  // Add your Razorpay Key ID here
                    amount: price,
                    currency: "INR",
                    name: "Cosine",
                    description: `Upgrade to ${plan} Plan`,
                    order_id: orderData.order_id,
                    handler: async (response) => {
                        await verifyPayment(plan, response);
                    },
                    prefill: {
                        name: user.name || "",
                        email: user.email || "",
                    },
                    theme: {
                        color: "#c8b4f0"
                    }
                };

                const razorpay = new Razorpay(options);
                razorpay.open();
            } catch (error) {
                showError('Error initializing payment: ' + error.message);
            } finally {
                showPlanLoading(false);
            }
        }

        async function verifyPayment(plan, paymentResponse) {
            const token = localStorage.getItem('authToken');

            try {
                showPlanLoading(true);
                
                const response = await fetch(getApiUrl('/payments/verify'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        plan,
                        razorpay_payment_id: paymentResponse.razorpay_payment_id,
                        razorpay_order_id: paymentResponse.razorpay_order_id,
                        razorpay_signature: paymentResponse.razorpay_signature
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Update local user data with subscription information
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    user.plan = plan;
                    if (data.user && data.user.subscription_end_date) {
                        user.subscription_end_date = data.user.subscription_end_date;
                    }
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    loadProfile();
                    showSuccess(`Plan upgraded to ${plan} successfully!`);
                } else {
                    showError(data.detail || 'Payment verification failed');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showPlanLoading(false);
            }
        }

        async function updatePlanDirect(plan) {
            const token = localStorage.getItem('authToken');

            try {
                showPlanLoading(true);
                clearMessages();

                const response = await fetch(getApiUrl('/user/update-plan'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ plan })
                });

                const data = await response.json();

                if (response.ok) {
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    user.plan = plan;
                    if (data.user && data.user.subscription_end_date) {
                        user.subscription_end_date = data.user.subscription_end_date;
                    }
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    loadProfile();
                    showSuccess('Plan updated successfully!');
                } else {
                    showError(data.detail || 'Failed to update plan');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showPlanLoading(false);
            }
        }

        function goBack() {
            window.location.href = '/projects.html';
        }

        function handleLogout() {
            clearAuthSession();
            window.location.href = '/signin.html';
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.classList.add('show');
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('show');
        }

        function clearMessages() {
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showNameLoading(show) {
            document.getElementById('nameLoading').style.display = show ? 'block' : 'none';
        }

        function showPlanLoading(show) {
            document.getElementById('planLoading').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
