<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Cosine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --bg2: #070707;
            --bg3: #0a0a0a;
            --surface: rgba(255,255,255,0.03);
            --surface2: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --text: #f0eef8;
            --text2: rgba(240,238,248,0.5);
            --text3: rgba(240,238,248,0.26);
            --accent: #c8b4f0;
            --accent2: #f4a8c7;
            --accent3: #7dd4b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: #000000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(32px);
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s;
        }

        .logo-link:hover {
            opacity: 0.8;
        }

        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            font-weight: 400;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            border-right: 1px solid var(--border);
        }

        .user-info span {
            font-size: 13px;
        }

        .user-info .plan-badge {
            font-size: 11px;
            background: rgba(200, 180, 240, 0.1);
            border: 1px solid rgba(200, 180, 240, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            color: var(--accent);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .main-content {
            padding: 100px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            font-weight: 400;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #d4c0f6;
            transform: translateY(-1px);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .project-card {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .project-card:hover {
            border-color: var(--accent);
            background: rgba(200, 180, 240, 0.02);
            transform: translateY(-4px);
        }

        .project-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: 'Instrument Serif', serif;
        }

        .project-date {
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 16px;
        }

        .project-files {
            font-size: 12px;
            color: var(--text2);
            padding: 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 16px;
        }

        .project-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .project-actions button {
            flex: 1;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border2);
            color: var(--text2);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .project-actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .project-actions button.delete:hover {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg2);
            border: 1px dashed var(--border2);
            border-radius: 12px;
            color: var(--text2);
        }

        .empty-state h2 {
            font-family: 'Instrument Serif', serif;
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 400;
        }

        .empty-state p {
            margin-bottom: 24px;
            font-size: 14px;
        }

        .create-project-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .create-project-modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-family: 'Instrument Serif', serif;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(200, 180, 240, 0.05);
        }

        input[type="file"]::file-selector-button {
            background: var(--surface2);
            border: 1px solid var(--border2);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(200, 180, 240, 0.1);
            border-color: var(--accent);
        }

        .file-list {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text2);
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            padding: 8px;
            background: var(--surface);
            border-radius: 6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item .remove-file {
            background: none;
            border: none;
            color: var(--accent2);
            cursor: pointer;
            font-size: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-actions .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .modal-actions .btn-cancel {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border2);
        }

        .modal-actions .btn-cancel:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text2);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="projects.html" class="logo-link">
            <img src="v1-01.png" alt="Cosine Logo" style="width: 30px; height: 30px; object-fit: contain;">
            <div class="logo">Cosine</div>
        </a>
        <div class="nav-right">
            <div class="user-info">
                <span id="userName">User</span>
                <span class="plan-badge" id="planBadge">Free</span>
            </div>
            <button class="logout-btn" onclick="goToProfile()" style="cursor: pointer; border: none; background: none; padding: 0; color: var(--text2); font-size: 20px; transition: color 0.2s;">⚙️</button>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Your Projects</h1>
            <button class="btn-primary" onclick="openCreateProjectModal()">+ New Project</button>
        </div>

        <div id="projectsContainer">
            <div class="projects-grid" id="projectsGrid"></div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>No Projects Yet</h2>
            <p>Create your first project to get started with Cosine</p>
            <button class="btn-primary" onclick="openCreateProjectModal()">Create Project</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div style="margin-top: 8px;">Loading projects...</div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="create-project-modal" id="createProjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Project</h2>
                <p style="color: var(--text2); font-size: 13px;">Give your project a name and add files</p>
            </div>

            <form onsubmit="handleCreateProject(event)">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" placeholder="My Awesome Project" required>
                </div>

                <div class="form-group">
                    <label for="projectFiles">Upload Files (Optional)</label>
                    <input type="file" id="projectFiles" multiple>
                    <div class="file-list" id="fileList"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeCreateProjectModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Create Project</button>
                </div>
            </form>

            <div class="loading" id="modalLoading">
                <div class="spinner"></div>
                <div style="margin-top: 8px;">Creating project...</div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let selectedFiles = [];

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadProjects();
            setupFileInput();
        });

        function checkAuth() {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.user_id) {
                window.location.href = '/signin.html';
                return;
            }

            document.getElementById('userName').textContent = user.name || 'User';
            document.getElementById('planBadge').textContent = user.plan || 'Free';
            
            // Store current user ID for validation
            window.currentUserId = user.user_id;
        }

        async function loadProjects() {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            try {
                const response = await fetch('http://localhost:8000/projects', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    // Token is invalid or expired, redirect to signin
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('user');
                    window.location.href = '/signin.html';
                    return;
                }
                
                if (!response.ok) throw new Error('Failed to load projects');

                const projects = await response.json();
                displayProjects(projects);
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        function displayProjects(projects) {
            const grid = document.getElementById('projectsGrid');
            const emptyState = document.getElementById('emptyState');

            if (!projects || projects.length === 0) {
                emptyState.style.display = 'block';
                grid.innerHTML = '';
                return;
            }

            emptyState.style.display = 'none';
            grid.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-name">${project.project_name}</div>
                    <div class="project-date">${new Date(project.created_at).toLocaleDateString()}</div>
                    <div class="project-files">
                        <strong>${project.files.length}</strong> file(s)
                    </div>
                    <div class="project-actions">
                        <button onclick="openProject('${project.project_id}')">Open</button>
                        <button class="delete" onclick="deleteProject('${project.project_id}', '${project.project_name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openCreateProjectModal() {
            selectedFiles = [];
            document.getElementById('projectName').value = '';
            document.getElementById('projectFiles').value = '';
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('createProjectModal').classList.add('show');
        }

        function closeCreateProjectModal() {
            document.getElementById('createProjectModal').classList.remove('show');
        }

        function setupFileInput() {
            document.getElementById('projectFiles').addEventListener('change', (e) => {
                selectedFiles = Array.from(e.target.files);
                updateFileList();
            });
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <span>${file.name}</span>
                    <button type="button" class="remove-file" onclick="removeFile(${index})">✕</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        async function handleCreateProject(event) {
            event.preventDefault();

            const projectName = document.getElementById('projectName').value;
            const token = localStorage.getItem('authToken');

            if (!projectName.trim()) {
                alert('Please enter a project name');
                return;
            }

            try {
                showModalLoading(true);

                // Create project
                const response = await fetch('http://localhost:8000/projects/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ project_name: projectName })
                });

                if (!response.ok) throw new Error('Failed to create project');

                const project = await response.json();

                // Upload files if any
                if (selectedFiles.length > 0) {
                    for (const file of selectedFiles) {
                        const formData = new FormData();
                        formData.append('file', file);

                        await fetch(`http://localhost:8000/projects/${project.project_id}/upload`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            },
                            body: formData
                        });
                    }
                }

                closeCreateProjectModal();
                loadProjects();
            } catch (error) {
                alert('Error creating project: ' + error.message);
            } finally {
                showModalLoading(false);
            }
        }

        function openProject(projectId) {
            localStorage.setItem('currentProjectId', projectId);
            window.location.href = `/logged.html#/project/${projectId}`;
        }

        async function deleteProject(projectId, projectName) {
            if (!confirm(`Delete project "${projectName}"? This cannot be undone.`)) {
                return;
            }

            const token = localStorage.getItem('authToken');

            try {
                const response = await fetch(`http://localhost:8000/projects/${projectId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    loadProjects();
                } else {
                    alert('Failed to delete project');
                }
            } catch (error) {
                alert('Error deleting project: ' + error.message);
            }
        }

        function goToProfile() {
            window.location.href = '/profile.html';
        }

        function handleLogout() {
            clearAuthSession();
            window.location.href = '/signin.html';
        }

        function showModalLoading(show) {
            document.getElementById('modalLoading').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
